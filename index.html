<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mita-3.0-ssa/favicon.svg" />
    <!--
      Explicit links for the raster and pinned-tab icons. The PWA plugin's
      includeAssets only precaches these files; it does not emit link tags. Because
      the app is served under a sub-path, the browser's root-level /favicon.ico
      probe never finds ours, and Safari pinned tabs need rel="mask-icon".
    -->
    <link rel="icon" type="image/x-icon" href="/mita-3.0-ssa/favicon.ico" sizes="32x32" />
    <link rel="mask-icon" href="/mita-3.0-ssa/mask-icon.svg" color="#6B4E71" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Self-assess your Medicaid IT maturity against the MITA 3.0 framework. Privacy-first, offline-capable PWA." />
    <meta name="theme-color" content="#6B4E71" />
    <link rel="apple-touch-icon" href="/mita-3.0-ssa/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>MITA Self-Assessment Tool</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
